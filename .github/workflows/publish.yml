name: Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Recovery only: existing release tag (for example v1.0.0)'
        type: string
        default: ''
      recovery_run_id:
        description: 'Recovery only: failed Publish run with existing release-artifacts'
        type: string
        default: ''
  release:
    types:
      - published

concurrency:
  group: publish-refs/tags/${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Validate release and recovery source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: node scripts/release-context.js

      - name: Enable Corepack
        if: steps.release.outputs.recovering != 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.release.outputs.recovering != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check
        if: steps.release.outputs.recovering != 'true'
        run: pnpm run check

      - name: Check package versions
        if: steps.release.outputs.recovering != 'true'
        run: pnpm run check:versions

      - name: Test
        if: steps.release.outputs.recovering != 'true'
        run: pnpm test

      - name: Build
        if: steps.release.outputs.recovering != 'true'
        run: pnpm run build

      - name: Check package contents
        if: steps.release.outputs.recovering != 'true'
        run: pnpm run check:packages

      - name: Create npm package
        if: steps.release.outputs.recovering != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release-input"
          npm pack --pack-destination "$RUNNER_TEMP/release-input"
        working-directory: packages/language-server

      - name: Create VSIX package
        if: steps.release.outputs.recovering != 'true'
        run: |
          pnpm --filter riot-v3-language-features run pack
          version="$(node -p "require('./packages/vscode/package.json').version")"
          cp "packages/vscode/riot-v3-language-features-$version.vsix" "$RUNNER_TEMP/release-input/"

      - name: Download original release artifacts
        if: steps.release.outputs.recovering == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release-input
          run-id: ${{ inputs.recovery_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify and normalize release artifacts
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RECOVERING: ${{ steps.release.outputs.recovering }}
        run: |
          if [ "$RECOVERING" = true ]; then
            node scripts/release-artifacts.js "$RUNNER_TEMP/release-input" "$RUNNER_TEMP/release-artifacts" "$RELEASE_TAG" --recover
          else
            node scripts/release-artifacts.js "$RUNNER_TEMP/release-input" "$RUNNER_TEMP/release-artifacts" "$RELEASE_TAG"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error

  stage-npm:
    name: Stage npm Package
    runs-on: ubuntu-latest
    needs: package
    environment: release
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Verify artifacts and resolve npm path
        working-directory: release-artifacts
        run: |
          shopt -s nullglob
          tarballs=("$PWD"/*.tgz)
          vsixes=("$PWD"/*.vsix)
          test "${#tarballs[@]}" -eq 1
          test "${#vsixes[@]}" -eq 1
          sha256sum --strict --check checksums.txt
          echo "NPM_TARBALL=${tarballs[0]}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup npm CLI
        run: |
          npm install --global npm@11.18.0 --ignore-scripts
          npm --version

      - name: Stage npm package
        run: npm stage publish "$NPM_TARBALL"

  publish-vscode:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest
    needs: package
    environment: release
    permissions: {}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Verify artifacts and resolve VSIX path
        working-directory: release-artifacts
        run: |
          shopt -s nullglob
          tarballs=("$PWD"/*.tgz)
          vsixes=("$PWD"/*.vsix)
          test "${#tarballs[@]}" -eq 1
          test "${#vsixes[@]}" -eq 1
          sha256sum --strict --check checksums.txt
          echo "VSIX=${vsixes[0]}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Install vsce
        run: npm install --global @vscode/vsce@3.9.2

      - name: Publish VS Code extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT"

  attach-artifacts:
    name: Attach Artifacts
    runs-on: ubuntu-latest
    needs:
      - package
      - stage-npm
      - publish-vscode
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Attach artifacts to GitHub Release
        working-directory: release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          shopt -s nullglob
          tarballs=("$PWD"/*.tgz)
          vsixes=("$PWD"/*.vsix)
          test "${#tarballs[@]}" -eq 1
          test "${#vsixes[@]}" -eq 1
          sha256sum --strict --check checksums.txt
          gh release upload "$RELEASE_TAG" "${tarballs[0]}" "${vsixes[0]}" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
